server:
  port: 8084

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/file-storage-db
    username: user
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    url: jdbc:mysql://localhost:3306/file-storage-db
    user: user
    password: password
    locations: classpath:db/migration
    enabled: true

  webflux:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:files}

jwt:
  secret: testtesttesttesttesttesttesttesttestesttesttesttesttesttesttesttesttes
  expiration: 604800
  header: Authorization